[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "porkbun-dns-mcp"
version = "0.4.0"
description = "Unofficial MCP server for Porkbun DNS management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.0,<4",
    "mcp-common>=0.18.0",
    "oneiric>=0.16.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
mcp-common = { path = "../mcp-common", editable = true }

[project.scripts]
porkbun-dns-mcp = "porkbun_dns_mcp.cli:main"

[tool.porkbun-dns-mcp]
http_port = 3042
http_host = "127.0.0.1"
enable_http_transport = false

[dependency-groups]
dev = [
    "crackerjack>=0.50.1",
    "session-buddy>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4"]
extend-select = ["I"]

[tool.pyright]
include = ["porkbun_dns_mcp"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=porkbun_dns_mcp --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow-running tests",
    "network: Tests requiring network access"
]

[tool.coverage.run]
source = ["porkbun_dns_mcp"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

[tool.bandit]
exclude_dirs = ["/tests"]
skips = ["B101"]

[tool.creosote]
# Skip self-tool scan: crackerjack is declared in [dependency-groups].dev
# but is the tool running creosote itself. Without this, creosote flags
# crackerjack as an unused runtime import (false positive). See
# https://github.com/fredrikaverpil/creosote for the full schema.
exclude-deps = ["crackerjack"]

[tool.crackerjack]
# Baseline configuration (auto-bootstrapped 2026-08-20).
# Hook stages run on `crackerjack run`; see crackerjack --help for the
# full lifecycle. refurb_timeout raised from default 300s to 420s because
# large refactor passes on first run can exceed 5 minutes on cold cache.
refurb_timeout = 420
